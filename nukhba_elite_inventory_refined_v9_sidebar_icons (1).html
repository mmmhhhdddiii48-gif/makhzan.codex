<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>النخبة للحلول الإدارية – نظام إدارة المخازن والفروع</title>
  <style>
    :root{
      --side-w:204px;--flyout-w:320px;--accent:#81b64c;--accent-strong:#6fa13f;--accent-soft:rgba(129,182,76,.16);
      --bg:#20221e;--bg-deep:#171916;--nav:#242621;--nav-dark:#181a16;--panel:#2a2d28;--panel-2:#30332d;--panel-3:#373b34;
      --line:rgba(255,255,255,.075);--line-2:rgba(255,255,255,.045);--text:#f2f5ef;--muted:#b7bfaf;--faint:#879080;
      --danger:#d46458;--warning:#d4a243;--blue:#5b9bd5;--ok:#81b64c;--shadow:0 18px 46px rgba(0,0,0,.34);--soft-shadow:0 10px 24px rgba(0,0,0,.22);
      --radius:8px;--radius-sm:6px;--tr:160ms ease;--row-h:40px;--cell-py:8px;--cell-px:11px;--table-font:12px;
      --danger-soft:rgba(212,100,88,.14);--warning-soft:rgba(212,162,67,.14);--blue-soft:rgba(91,155,213,.14);--ok-soft:rgba(129,182,76,.14);
    }
    body[data-theme="green"]{--accent:#81b64c;--accent-strong:#6fa13f;--accent-soft:rgba(129,182,76,.16)}
    body[data-theme="blue"]{--accent:#5297d2;--accent-strong:#3f82bb;--accent-soft:rgba(82,151,210,.16)}
    body[data-theme="amber"]{--accent:#d9a441;--accent-strong:#bd8d31;--accent-soft:rgba(217,164,65,.16)}
    body[data-theme="violet"]{--accent:#8b78d6;--accent-strong:#7361bd;--accent-soft:rgba(139,120,214,.16)}
    body[data-theme="red"]{--accent:#cf6559;--accent-strong:#b95348;--accent-soft:rgba(207,101,89,.16)}
    body[data-theme="slate"]{--accent:#99a29a;--accent-strong:#7e887f;--accent-soft:rgba(153,162,154,.16)}
    body[data-density="comfortable"]{--row-h:54px;--cell-py:14px;--cell-px:15px;--table-font:13px}
    body[data-density="middle"]{--row-h:46px;--cell-py:11px;--cell-px:13px;--table-font:12.5px}
    body[data-density="compact"]{--row-h:38px;--cell-py:8px;--cell-px:11px;--table-font:12px}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:"Segoe UI",Tahoma,Arial,sans-serif;
      overflow:hidden;
      direction:rtl;
    }
    button,input,select,textarea{font-family:inherit}
    button{cursor:pointer;border:0}
    input,select,textarea{outline:0}
    ::selection{background:var(--accent);color:#11140f}

    .app{width:100vw;height:100vh;overflow:hidden;background:
      radial-gradient(circle at 84% 8%, rgba(129,182,76,.07), transparent 34%),
      radial-gradient(circle at 12% 86%, rgba(255,255,255,.035), transparent 30%),
      var(--bg);position:relative}

    .nav-scroll{padding:4px 0 12px;overflow-y:auto;overflow-x:hidden;flex:1;scrollbar-color:var(--accent) transparent;scrollbar-width:thin}.nav-scroll::-webkit-scrollbar{width:7px}.nav-scroll::-webkit-scrollbar-thumb{background:var(--accent);border-radius:12px}
    .side-item{margin:1px 8px;min-height:36px;border-radius:4px;color:#e4e6df;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 9px 0 8px;transition:background var(--tr),color var(--tr);position:relative;user-select:none}.side-item:hover{background:#30332c;color:#fff}.side-item.active{background:var(--accent);color:#151711}.side-meta{display:flex;align-items:center;gap:8px;min-width:0}.ico{width:20px;text-align:center;font-size:14px}.label{font-size:12px;font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chev{font-size:18px;opacity:.7;transform:rotate(180deg)}
    .side-bottom{border-top:1px solid var(--line-2);padding:10px 10px 12px;background:var(--nav-dark);display:flex;flex-direction:column;gap:8px}.mini-search{height:30px;border:1px solid var(--line);background:#20221d;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:8px;color:#bfc5b4;font-size:11px}.user-mini{display:flex;align-items:center;gap:8px;font-size:11px;color:#e6e8e1;background:#22241f;border-radius:5px;padding:7px;border:1px solid var(--line-2)}.avatar-mini{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#111;display:grid;place-items:center;font-weight:900}.bottom-icons{display:flex;justify-content:space-between;color:#b8bead;font-size:13px;gap:5px}.bottom-icons span[data-save-now],.bottom-icons span[data-logout],.bottom-icons span[data-jump]{width:22px;height:22px;border-radius:5px;display:inline-grid;place-items:center;cursor:pointer;transition:background var(--tr),color var(--tr),transform var(--tr);position:relative}.bottom-icons span[data-save-now]:hover,.bottom-icons span[data-logout]:hover,.bottom-icons span[data-jump]:hover{background:var(--accent);color:#111;transform:translateY(-1px)}.bottom-icons span[data-save-now]:active,.bottom-icons span[data-logout]:active,.bottom-icons span[data-jump]:active{transform:translateY(0)}.badge-dot{display:inline-block;min-width:16px;height:16px;border-radius:16px;background:var(--danger);font-size:9px;text-align:center;line-height:16px;color:#fff;margin-inline-end:-6px;transform:translateY(-6px)}
    .flyout{position:fixed;right:calc(var(--side-w) - 1px);width:var(--flyout-w);background:#292b26;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:0 8px 8px 0;z-index:60;padding:10px 0;opacity:0;transform:translateX(8px);pointer-events:none;transition:opacity var(--tr),transform var(--tr);max-height:80vh;overflow:auto}.flyout.open{opacity:1;transform:translateX(0);pointer-events:auto}.flyout-title{height:42px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;color:#f1f4ec;border-bottom:1px solid var(--line-2);margin-bottom:6px}.flyout-title strong{font-size:13px}.flyout-title small{color:var(--muted)}.flyout-opt{height:36px;margin:1px 9px;border-radius:4px;display:flex;align-items:center;justify-content:space-between;gap:9px;padding:0 10px;color:#d9ddd2;font-size:12px;font-weight:650;transition:background var(--tr),color var(--tr),padding var(--tr)}.flyout-opt:hover{background:#353832;color:#fff;padding-inline-start:14px}.flyout-opt.active{background:var(--accent);color:#111}.option-ico{font-size:13px;opacity:.85}

    /* Workspace */
    .workspace{height:100vh;margin-right:var(--side-w);padding:28px 32px;overflow:auto;transition:margin-right var(--tr);scrollbar-color:var(--accent) transparent;scrollbar-width:thin}
    .workspace::-webkit-scrollbar{width:8px}.workspace::-webkit-scrollbar-thumb{background:var(--accent);border-radius:20px}

    .top-strip{
      min-height:54px;margin:-22px -24px 18px;padding:0 24px;background:rgba(0,0,0,.13);
      border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:16px;
      position:sticky;top:-22px;z-index:20;backdrop-filter:blur(8px)
    }
    .crumb{display:flex;align-items:center;gap:9px;color:#acb3a5;font-size:12px;min-width:0}
    .crumb b{color:#eef2eb;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .top-pill{height:30px;padding:0 10px;border-radius:999px;background:#2f322c;border:1px solid var(--line);color:#dfe5d8;font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
    .top-user-actions{height:32px;display:inline-flex;align-items:center;gap:6px;background:#22241f;border:1px solid var(--line-2);border-radius:8px;padding:3px 5px 3px 6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.015)}
    .top-avatar{width:24px;height:24px;border-radius:7px;background:var(--accent);color:#111;display:grid;place-items:center;font-size:11px;font-weight:950;line-height:1}
    .top-logout{width:24px;height:24px;border-radius:6px;background:transparent;color:#dfe5d8;border:1px solid transparent;display:grid;place-items:center;font-size:13px;line-height:1;transition:background var(--tr),color var(--tr),border-color var(--tr),transform var(--tr)}
    .top-logout:hover{background:var(--danger-soft);color:#ffbdb6;border-color:rgba(212,100,88,.22);transform:translateY(-1px)}

    .page{min-height:calc(100vh - 92px)}
    .page-head{background:linear-gradient(180deg,var(--panel) 0%,#262922 100%);border:1px solid var(--line-2);border-radius:var(--radius);padding:15px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:var(--soft-shadow)}
    .page-title{min-width:0}
    .eyebrow{display:block;color:var(--accent);font-size:10.5px;font-weight:950;letter-spacing:.8px;margin-bottom:5px;text-transform:uppercase}
    .page-title h1{margin:0;color:#fff;font-size:22px;letter-spacing:-.35px}
    .page-title p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.7;max-width:780px}
    .head-badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

    /* Buttons */
    .btn{height:32px;padding:0 12px;border-radius:var(--radius-sm);font-size:11.5px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;background:#2f322c;color:#dfe5d8;border:1px solid var(--line);transition:background var(--tr),color var(--tr),border-color var(--tr),transform var(--tr)}
    .btn:hover{background:#363a32;color:#fff;transform:translateY(-1px)}
    .btn.primary{background:var(--accent);color:#111;border-color:transparent}
    .btn.primary:hover{background:var(--accent-strong);color:#111}
    .btn.secondary{background:#2f322c;color:#dfe5d8}
    .btn.success{background:var(--ok-soft);color:#dff7c6;border-color:rgba(129,182,76,.24)}
    .btn.warning{background:var(--warning-soft);color:#ffdfa1;border-color:rgba(212,162,67,.22)}
    .btn.danger{background:var(--danger-soft);color:#ffbdb6;border-color:rgba(212,100,88,.22)}
    .btn.print{background:var(--blue-soft);color:#c3e3ff;border-color:rgba(91,155,213,.22)}
    .btn.back{background:transparent;color:var(--muted)}
    .btn.icon{width:32px;padding:0}
    .btn.small{height:26px;padding:0 8px;font-size:10.5px}

    /* Cards */
    .summary-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
    .sum-card{background:linear-gradient(180deg,var(--panel) 0%,#272a25 100%);border:1px solid var(--line-2);border-radius:var(--radius);padding:15px;box-shadow:var(--soft-shadow);position:relative;overflow:hidden;min-height:102px}

    .sum-card span{display:block;color:var(--muted);font-size:11px;margin-bottom:7px;font-weight:800}
    .sum-card strong{font-size:23px;color:#fff;letter-spacing:-.4px}
    .sum-card small{display:block;color:var(--accent);margin-top:8px;font-weight:850;font-size:10.5px;line-height:1.5}
    .sum-card.warn:before{background:linear-gradient(90deg,transparent,var(--warning),transparent)}
    .sum-card.danger:before{background:linear-gradient(90deg,transparent,var(--danger),transparent)}
    .sum-card.blue:before{background:linear-gradient(90deg,transparent,var(--blue),transparent)}

    .content-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:start}
    .section-card{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--soft-shadow);overflow:hidden;margin-bottom:20px}
    .section-head{height:48px;padding:0 13px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:10px;background:#2d302b}
    .section-head h2,.section-head h3{margin:0;font-size:14px;color:#fff;font-weight:950}
    .section-head small{color:var(--muted);font-size:11px;font-weight:800}
    .section-body{padding:16px}

    .alerts-list{display:grid;gap:8px}
    .alert-item{display:flex;align-items:flex-start;gap:9px;padding:10px;border-radius:8px;background:#252822;border:1px solid var(--line-2)}
    .alert-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:0 0 30px;background:var(--accent-soft);color:var(--accent);font-weight:950}
    .alert-item.warning .alert-ico{background:var(--warning-soft);color:#ffdca4}
    .alert-item.danger .alert-ico{background:var(--danger-soft);color:#ffbfb8}
    .alert-item b{display:block;font-size:12px;color:#fff;margin-bottom:3px}
    .alert-item span{display:block;color:var(--muted);font-size:11px;line-height:1.6}

    .quick-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
    .quick-card{min-height:76px;background:#252822;border:1px solid var(--line-2);border-radius:8px;padding:11px;display:flex;align-items:center;gap:9px;color:#fff;transition:background var(--tr),transform var(--tr),border-color var(--tr)}
    .quick-card:hover{background:#30332d;border-color:rgba(129,182,76,.22);transform:translateY(-1px)}
    .quick-card i{font-style:normal;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
    .quick-card b{display:block;font-size:12px;margin-bottom:4px}.quick-card span{font-size:10.5px;color:var(--muted)}

    /* Tables and controls */
    .toolbar{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--radius);padding:12px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:var(--soft-shadow);flex-wrap:wrap}
    .tool-right,.tool-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .control{height:32px;background:#22251f;border:1px solid var(--line);border-radius:var(--radius-sm);color:#f1f5ed;padding:0 9px;font-size:12px;min-width:130px}
    .control.search{width:260px}.control::placeholder{color:#7d8578}
    .table-card{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--radius);overflow:hidden;box-shadow:var(--soft-shadow)}
    .table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:980px}
    th,td{height:var(--row-h);padding:8px 11px;border-bottom:1px solid rgba(255,255,255,.045);font-size:var(--table-font);text-align:right;white-space:nowrap}
    th{color:#dce2d7;background:#30332d;font-size:11px;font-weight:950;position:sticky;top:0;z-index:2}
    td{color:#eef1ea}tr:hover td{background:rgba(255,255,255,.025)}
    .status{height:23px;border-radius:99px;padding:0 8px;display:inline-flex;align-items:center;font-size:10px;font-weight:900;border:1px solid var(--line)}
    .status.ok{background:var(--ok-soft);color:#cdeaaf}.status.warn{background:var(--warning-soft);color:#ffd9a0}.status.danger{background:var(--danger-soft);color:#ffb9b1}.status.blue{background:var(--blue-soft);color:#c3e3ff}.status.muted{background:rgba(255,255,255,.05);color:var(--muted)}
    .row-actions{display:flex;gap:5px;align-items:center}
    .pager{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#272a25;border-top:1px solid var(--line-2);color:var(--muted);font-size:11px}
    .empty{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--radius);padding:34px;text-align:center;box-shadow:var(--soft-shadow);color:var(--muted)}
    .empty b{display:block;color:#fff;font-size:15px;margin-bottom:10px}

    .form-grid{display:grid;grid-template-columns:repeat(3,minmax(170px,1fr));gap:11px}
    .field label{display:block;color:#dfe5d8;font-size:11px;font-weight:850;margin:0 2px 6px}
    .form-control{width:100%;min-height:34px;background:#22251f;border:1px solid var(--line);border-radius:var(--radius-sm);color:#f1f5ed;padding:8px 9px;font-size:12px}
    textarea.form-control{min-height:82px;resize:vertical;line-height:1.7}
    .field.full{grid-column:1/-1}.form-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:13px;padding-top:12px;border-top:1px solid var(--line-2);flex-wrap:wrap}

    .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .identity-card{padding:14px;display:grid;gap:12px}
    .palette-row{display:flex;gap:8px;flex-wrap:wrap}.palette-chip{height:36px;border-radius:8px;border:1px solid var(--line);min-width:92px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff}
    @media(max-width:1320px){.summary-row{grid-template-columns:repeat(3,1fr)}.quick-grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:1120px){:root{--side-w:174px}.workspace{padding:22px 18px}.top-strip{margin:-22px -18px 18px;padding:0 18px;top:-22px}.content-grid,.settings-grid{grid-template-columns:1fr}.summary-row{grid-template-columns:repeat(2,1fr)}.quick-grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.control.search{width:100%}}
    @media(max-width:720px){.summary-row,.quick-grid{grid-template-columns:1fr}.top-strip{align-items:flex-start;flex-direction:column;padding-top:10px;padding-bottom:10px}}

function sectionForPage(key){ return sections.find(s => s.key===key || s.pages.some(p=>p.key===key)) || sections[0]; }
function rootKeyForPage(key){ return sectionForPage(key).key; }
function pageLabelForKey(key){ const sec=sectionForPage(key); const pg=sec.pages.find(p=>p.key===key); return pg?pg.label:sec.label; }
function isAddPage(key){ return Object.values(addPageForRoot).includes(key) || ['transfers_receive','inventory_partial','backup_restore'].includes(key); }

function navIcon(name){
  const c='class="nav-svg" viewBox="0 0 24 24" aria-hidden="true"';
  const i={dashboard:`<svg ${c}><rect x="4" y="4" width="6" height="6" rx="1.4"/><rect x="14" y="4" width="6" height="6" rx="1.4"/><rect x="4" y="14" width="6" height="6" rx="1.4"/><rect x="14" y="14" width="6" height="6" rx="1.4"/></svg>`,items:`<svg ${c}><path d="M20 12l-8 8-8-8V4h8z"/><path d="M8.5 8.5h.01"/><path d="M12 4l8 8"/></svg>`,warehouses:`<svg ${c}><path d="M4 10l8-5 8 5"/><path d="M6 10v9h12v-9"/><path d="M9 19v-5h6v5"/><path d="M8 12h8"/></svg>`,inbound:`<svg ${c}><path d="M12 4v10"/><path d="M8 10l4 4 4-4"/><path d="M5 18h14"/></svg>`,outbound:`<svg ${c}><path d="M12 14V4"/><path d="M8 8l4-4 4 4"/><path d="M5 18h14"/></svg>`,transfers:`<svg ${c}><path d="M7 7h11"/><path d="M15 4l3 3-3 3"/><path d="M17 17H6"/><path d="M9 14l-3 3 3 3"/></svg>`,inventory:`<svg ${c}><path d="M8 4h8l1 2h3v15H4V6h3z"/><path d="M9 11h6"/><path d="M9 15h6"/></svg>`,returns:`<svg ${c}><path d="M9 7l-5 5 5 5"/><path d="M5 12h11a4 4 0 0 1 0 8h-2"/></svg>`,damaged:`<svg ${c}><path d="M12 3l9 16H3z"/><path d="M12 9v4"/></svg>`,suppliers:`<svg ${c}><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/></svg>`,reports:`<svg ${c}><path d="M4 19h16"/><path d="M7 16v-5"/><path d="M12 16V7"/><path d="M17 16v-8"/></svg>`,users:`<svg ${c}><path d="M12 3l7 3v5c0 4.5-2.8 7.2-7 9-4.2-1.8-7-4.5-7-9V6z"/></svg>`,ledger:`<svg ${c}><path d="M6 4h12v16H6z"/><path d="M9 8h6"/><path d="M9 12h6"/></svg>`,settings:`<svg ${c}><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2.1-.5a7 7 0 0 0-.7-1.7l1.1-1.8-2.1-2.1"/></svg>`,backup:`<svg ${c}><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v10c0 1.7 3.1 3 7 3s7-1.3 7-3V5"/></svg>`};

function safeNavigate(next){ if(!next || next===appState.active) return; appState.navHistory.push(appState.active); appState.active=next; localStorage.setItem('makhzan.active',next); render(); }
function goBack(){ const prev=appState.navHistory.pop(); safeNavigate(prev || rootKeyForPage(appState.active)); }

function recalcStock(){
  const base = Object.fromEntries(appState.items.map(i=>[i.code,0]));
  appState.docs.inbound.filter(d=>d.status==='posted').forEach(d=>base[d.item]=(base[d.item]||0)+d.qty);
  appState.docs.outbound.filter(d=>d.status==='posted').forEach(d=>base[d.item]=(base[d.item]||0)-d.qty);
  appState.docs.damaged.filter(d=>d.status==='posted').forEach(d=>base[d.item]=(base[d.item]||0)-d.qty);
  appState.docs.returns.filter(d=>d.status==='posted').forEach(d=>base[d.item]=(base[d.item]||0)+(d.mode==='صالح'?d.qty:0));
  appState.docs.inventory.filter(d=>d.status==='posted').forEach(d=>{ base[d.item]=d.counted; });
  appState.items.forEach(item=>{ item.stock = Math.max(0, base[item.code] ?? item.stock); });
}

function canPost(docType, doc){
  if(doc.status==='posted' || appState.locked.has(doc.no)) return {ok:false,msg:'تم ترحيل العملية مسبقاً.'};
  const stock = (appState.items.find(i=>i.code===doc.item)?.stock) ?? 0;
  if(['outbound','damaged'].includes(docType) && doc.qty>stock) return {ok:false,msg:'لا يمكن الصرف أو الإتلاف مع رصيد سالب.'};
  if(docType==='returns' && doc.qty<0) return {ok:false,msg:'كمية المرتجع غير صالحة.'};
  return {ok:true};
}

function postDocument(docType, no){
  const doc = appState.docs[docType].find(d=>d.no===no);
  if(!doc) return;
  const v = canPost(docType, doc);
  if(!v.ok){ alert(v.msg); return; }
  appState.locked.add(no); doc.status='posted'; recalcStock(); render();
}

function addDocument(type, payload){
  if(appState.docs[type].some(d=>d.no===payload.no)){ alert('رقم المرجع مكرر.'); return; }
  appState.docs[type].push({...payload,status:'draft',user:'مدير النظام'});
  safeNavigate(rootKeyForPage(type));
}

function pageHead(cfg){ return `<div class="page-head"><div class="page-title"><span class="eyebrow">نظام إدارة المخازن والفروع</span><h1>${cfg.title}</h1><p>${cfg.desc}</p></div><div class="head-badges"><span class="top-pill">النخبة للحلول الإدارية – نظام إدارة المخازن والفروع</span></div></div>`; }

function renderNav(){
  const nav=document.getElementById('navScroll');
  const activeSection=rootKeyForPage(appState.active);
  nav.innerHTML=sections.map(s=>`<div class="side-item ${s.key===activeSection?'active':''}" data-section="${s.key}" title="${s.label}"><div class="side-meta"><span class="ico">${navIcon(s.icon)}</span><span class="label">${s.label}</span></div><span class="chev">›</span></div>`).join('');
}

function openFlyout(sec, anchor){
  const flyout=document.getElementById('flyout'); if(!sec) return;
  flyout.innerHTML=`<div class="flyout-title"><strong><span class="flyout-title-icon">${navIcon(sec.icon)}</span>${sec.label}</strong><small>${sec.pages.length}</small></div>${sec.pages.map(p=>`<div class="flyout-opt ${p.key===appState.active?'active':''}" data-page="${p.key}"><span>${p.label}</span><span class="option-ico">↵</span></div>`).join('')}`;
  const r=anchor.getBoundingClientRect(); flyout.style.top=Math.min(r.top,window.innerHeight-120)+'px'; flyout.classList.add('open');
}

function buildRows(root){
  if(root==='items') return appState.items.map(i=>[i.code,i.name,i.category,i.unit,String(i.stock),String(i.min),'—', i.stock<=i.min?'<span class="status warn">قريب من النفاد</span>':'<span class="status ok">جيد</span>']);
  if(root==='inbound') return appState.docs.inbound.map(d=>[d.no,d.date,'مورد',d.warehouse,'1','0 د.ع',d.status==='posted'?'<span class="status ok">مرحل</span>':'<span class="status muted">مسودة</span>',d.user]);
  if(root==='outbound') return appState.docs.outbound.map(d=>[d.no,d.date,'جهة داخلية',d.warehouse,'صرف تشغيلي','1',d.status==='posted'?'<span class="status ok">مرحل</span>':'<span class="status muted">مسودة</span>']);
  if(root==='transfers') return appState.docs.transfers.map(d=>[d.no,d.from,d.to,'اليوم','1',d.received?'<span class="status ok">مستلم</span>':'<span class="status warn">بانتظار الاستلام</span>',d.received?'مستلم':'—']);
  if(root==='inventory') return appState.docs.inventory.map(d=>[d.no,d.warehouse,d.type,'اليوم','0',d.status==='posted'?'<span class="status ok">مرحل</span>':'<span class="status muted">قيد التنفيذ</span>',d.user]);
  if(root==='returns') return appState.docs.returns.map(d=>[d.no,d.ref,d.item,String(d.qty),d.status==='posted'?'<span class="status ok">مرحل</span>':'<span class="status blue">قيد الفحص</span>',d.mode]);
  if(root==='damaged') return appState.docs.damaged.map(d=>[d.no,d.item,String(d.qty),d.reason,d.warehouse,'اليوم','0 د.ع']);
  return [];
}

const tableColumns={items:['كود الصنف','اسم الصنف','التصنيف','الوحدة','الرصيد الصافي','الحد الأدنى','آخر شراء','الحالة','إجراءات'],warehouses:['الكود','المخزن / الفرع','النوع','المسؤول','عدد الأصناف','آخر حركة','الحالة','إجراءات'],inbound:['رقم الوارد','التاريخ','المورد','المخزن','عدد الأصناف','الإجمالي','الحالة','المستخدم','إجراءات'],outbound:['رقم الصادر','التاريخ','الجهة المستلمة','المخزن','نوع الصادر','عدد الأصناف','الحالة','إجراءات'],transfers:['رقم التحويل','من','إلى','التاريخ','عدد الأصناف','الحالة','المستلم','إجراءات'],inventory:['رقم الجرد','المخزن','نوع الجرد','التاريخ','الفروقات','الحالة','المستخدم','إجراءات'],returns:['رقم المرتجع','الحركة الأصلية','الصنف','الكمية','الحالة','التأثير','إجراءات'],damaged:['رقم التلف','الصنف','الكمية','السبب','المخزن','التاريخ','القيمة','إجراءات']};

function buildTable(root, rows){
  const cols = tableColumns[root] || ['البيان','القيمة','الحالة','إجراءات'];
  return `<div class="table-card"><div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map((r,idx)=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}<td><div class="row-actions"><button class="btn small secondary" data-action="view" data-root="${root}" data-index="${idx}">عرض</button><button class="btn small success" data-action="post" data-root="${root}" data-index="${idx}">ترحيل</button></div></td></tr>`).join('')}</tbody></table></div><div class="pager"><span>عدد السجلات: ${rows.length}</span><span>صفحة 1</span></div></div>`;
}

function docDetails(root, idx){
  const d = (appState.docs[root]||[])[idx]; if(!d) return '<div class="empty"><b>لا توجد تفاصيل</b></div>';
  const entries = Object.entries(d).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  return `<div class="section-card"><div class="section-head"><h2>تفاصيل الحركة</h2><small>${d.no || ''}</small></div><div class="section-body"><table style="min-width:100%"><tbody>${entries}</tbody></table><div class="form-actions"><button class="btn back" data-action="back">رجوع</button></div></div></div>`;
}

function dashboard(){
  const inPosted=appState.docs.inbound.filter(d=>d.status==='posted').length;
  const outPosted=appState.docs.outbound.filter(d=>d.status==='posted').length;
  const pendingTransfers=appState.docs.transfers.filter(d=>!d.received).length;
  const low=appState.items.filter(i=>i.stock<=i.min).length;
  return `${pageHead(pageConfigs.dashboard)}<div class="summary-row dashboard-summary"><div class="sum-card"><span>إجمالي الأصناف</span><strong>${appState.items.length}</strong><small>مرتبط بالتصنيفات والباركود</small></div><div class="sum-card"><span>إجمالي الوارد المرحل</span><strong>${inPosted}</strong><small>تحديث مباشر</small></div><div class="sum-card"><span>إجمالي الصادر المرحل</span><strong>${outPosted}</strong><small>تحديث مباشر</small></div><div class="sum-card warn"><span>تحويلات معلقة</span><strong>${pendingTransfers}</strong><small>بانتظار الاستلام</small></div></div><div class="section-card"><div class="section-head"><h2>التنبيهات</h2><small>نقاط خطر</small></div><div class="section-body alerts-list"><div class="alert-item ${low?'danger':''}"><div class="alert-ico">!</div><div><b>نقص مخزون</b><span>${low} أصناف وصلت أو اقتربت من الحد الأدنى.</span></div></div></div></div><div class="section-card"><div class="section-head"><h2>وصول سريع</h2><small>عمليات يومية</small></div><div class="section-body quick-grid"><button class="quick-card" data-jump="inbound_add"><i>📥</i><span><b>تسجيل وارد</b><span>استلام بضاعة وترحيل</span></span></button><button class="quick-card" data-jump="outbound_add"><i>📤</i><span><b>تسجيل صادر</b><span>صرف مع منع السالب</span></span></button><button class="quick-card" data-jump="transfers_send"><i>🔁</i><span><b>تحويل مخزني</b><span>إرسال واستلام</span></span></button><button class="quick-card" data-jump="inventory_full"><i>🧮</i><span><b>بدء جرد</b><span>كامل أو جزئي</span></span></button><button class="quick-card" data-jump="reports_stock"><i>📈</i><span><b>التقارير</b><span>رصيد وحركة وفروقات</span></span></button></div></div>`;
}

function addForm(pageKey){
  const root = rootKeyForPage(pageKey);
  return `${pageHead(pageConfigs[root])}<div class="section-card"><div class="section-head"><h2>${pageLabelForKey(pageKey)}</h2><small>نموذج فعلي</small></div><div class="section-body"><form id="entityForm" data-root="${root}" class="form-grid"><div class="field"><label>المرجع</label><input class="form-control" name="no" required placeholder="رقم الحركة"></div><div class="field"><label>الصنف</label><select class="form-control" name="item">${appState.items.map(i=>`<option value="${i.code}">${i.code} - ${i.name}</option>`).join('')}</select></div><div class="field"><label>الكمية</label><input class="form-control" type="number" min="0" name="qty" required></div><div class="field"><label>المخزن</label><select class="form-control" name="warehouse">${appState.warehouses.map(w=>`<option value="${w.code}">${w.name}</option>`).join('')}</select></div><div class="field full"><label>ملاحظات</label><textarea class="form-control" name="notes"></textarea></div><div class="field full"><div class="form-actions"><button class="btn primary" type="submit">حفظ كمسودة</button><button class="btn back" type="button" data-action="back">رجوع</button></div></div></form></div></div>`;
}

function genericPage(key){
  const root=rootKeyForPage(key);
  if(isAddPage(key)) return addForm(key);
  if(key.endsWith('_view') && appState.viewDoc) return docDetails(appState.viewDoc.root, appState.viewDoc.idx);
  if(root==='settings') return settingsPage();
  if(root==='dashboard') return dashboard();
  const rows=buildRows(root);
  const addTarget=addPageForRoot[root];
  return `${pageHead(pageConfigs[root] || pageConfigs.dashboard)}<div class="summary-row"><div class="sum-card"><span>إجمالي السجلات</span><strong>${rows.length}</strong><small>حسب الفلتر الحالي</small></div><div class="sum-card blue"><span>نشط</span><strong>${rows.length}</strong><small>جاهز للعمل</small></div><div class="sum-card warn"><span>بانتظار مراجعة</span><strong>${rows.filter(r=>String(r).includes('مسودة')).length}</strong><small>يتطلب انتباه</small></div><div class="sum-card danger"><span>تنبيهات</span><strong>${appState.items.filter(i=>i.stock<=i.min).length}</strong><small>ضمن هذا القسم</small></div></div><div class="toolbar"><div class="tool-right"><input class="control search" placeholder="بحث..."><select class="control"><option>كل الحالات</option><option>نشط</option><option>مسودة</option><option>معلق</option></select><input class="control" type="date"></div><div class="tool-left">${addTarget?`<button class="btn primary" data-jump="${addTarget}">＋ إضافة</button>`:''}<button class="btn secondary" data-action="back">رجوع</button></div></div>${buildTable(root, rows)}`;
}

function settingsPage(){ return `${pageHead(pageConfigs.settings)}<div class="section-card"><div class="section-head"><h2>قواعد الواجهة</h2><small>ثابتة</small></div><div class="section-body"><div class="alerts-list"><div class="alert-item"><div class="alert-ico">✓</div><div><b>لا تغيير تصميمي</b><span>النسخة مثبتة وظيفياً فقط.</span></div></div></div></div></div>`; }

function render(){
  recalcStock(); renderNav();
  document.getElementById('crumbText').textContent = pageLabelForKey(appState.active);
  document.getElementById('page').innerHTML = genericPage(appState.active);
}

document.addEventListener('submit', e=>{
  const form=e.target.closest('#entityForm'); if(!form) return;
  e.preventDefault();
  const data=Object.fromEntries(new FormData(form).entries());
  const root=form.dataset.root;
  const payload={no:data.no,date:'اليوم',item:data.item,qty:Number(data.qty||0),warehouse:data.warehouse};
  if(root==='inbound') return addDocument('inbound', payload);
  if(root==='outbound') return addDocument('outbound', payload);
  if(root==='damaged') return addDocument('damaged', {...payload,reason:'غير محدد'});
  if(root==='returns') return addDocument('returns', {no:data.no,ref:'—',item:data.item,qty:Number(data.qty||0),mode:'صالح'});
  if(root==='inventory') return addDocument('inventory', {no:data.no,warehouse:data.warehouse,type:'جزئي',item:data.item,counted:Number(data.qty||0)});
  if(root==='transfers') return addDocument('transfers', {no:data.no,from:'WH-01',to:'BR-01',item:data.item,qty:Number(data.qty||0),received:false});
  safeNavigate(root);
});

document.addEventListener('click', e=>{
  const side=e.target.closest('[data-section]'); if(side){ openFlyout(sections.find(s=>s.key===side.dataset.section), side); return; }
  const pageOpt=e.target.closest('[data-page]'); if(pageOpt){ safeNavigate(pageOpt.dataset.page); document.getElementById('flyout')?.classList.remove('open'); return; }
  const jump=e.target.closest('[data-jump]'); if(jump){ safeNavigate(quickTarget[jump.dataset.jump] || jump.dataset.jump); document.getElementById('flyout')?.classList.remove('open'); return; }
  const action=e.target.closest('[data-action]');
  if(action){
    const root=action.dataset.root; const idx=Number(action.dataset.index);
    if(action.dataset.action==='back') return goBack();
    if(action.dataset.action==='view'){ appState.viewDoc={root,idx}; return safeNavigate(`${root}_view`); }
    if(action.dataset.action==='post'){
      const doc=(appState.docs[root]||[])[idx]; if(!doc){ alert('لا توجد حركة.'); return; }
      return postDocument(root, doc.no);
    }
  }
  if(e.target.closest('#sideSearch')) return alert('البحث السريع جاهز للاستخدام المحلي.');
  if(e.target.closest('[data-save-now]')){ localStorage.setItem('makhzan.snapshot', JSON.stringify(appState)); alert('تم حفظ نسخة محلية.'); return; }
  if(e.target.closest('[data-logout]')) return alert('تسجيل الخروج جاهز للربط.');
  if(!e.target.closest('.rightbar') && !e.target.closest('.flyout')) document.getElementById('flyout')?.classList.remove('open');
});

document.getElementById('dateText').textContent = new Date().toLocaleDateString('ar-IQ',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
render();
</script>
</body>
</html>
